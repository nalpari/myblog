<!DOCTYPE html>

<head>

</head>
<body>
  <div class="wrap">
    <article>
      <h1>Hello world</h1>
      <p class="meta">2026-09-03</p>

        이 파일은 <code>posts/hello-world.html</code>로 저장되어 있지만,

      </p>
    </article>
    <p class="nav"><a href="/">← 목록으로</a></p>
